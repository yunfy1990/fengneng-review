name: Release

# 推 tag 即建 release：v*  →  用 GITHUB_TOKEN 建 Release + 传附件图
# 附件与正文来自仓库内文件，改文案后重推 tag 即可（release 页面可单独编辑）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 建 release / 传附件所需
  # 注：内置 GITHUB_TOKEN 无 administration 权限，改仓库 description/topics 会 403。
  # 故那一步 continue-on-error；需要改仓库元信息时用有 admin 权限的 PAT 手动执行。

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::找不到 release 正文：$NOTES"
            exit 1
          fi
          {
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo "完整变更记录：[CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) ｜ 设计沿革：[skill/references/HISTORY.md](https://github.com/${{ github.repository }}/blob/main/skill/references/HISTORY.md)"
          } > /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 幂等：release 已存在则改写（重推 tag 时不会因"已存在"而失败）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为更新"
            gh release edit "$TAG" \
              --title "$TAG · 丰容/节能评审框架" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG · 丰容/节能评审框架" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi

      - name: Upload images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 清理历史遗留的错误附件名（早期版本把中文路径 + #标签 解析成了 default.png）
          gh release delete-asset "$TAG" default.png --yes 2>/dev/null || true
          gh release upload "$TAG" \
            "docs/four-dimensions.png" \
            "docs/evidence-discipline.png" \
            "docs/review-loop.png" \
            --clobber

      - name: Set repository description and topics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 内置 GITHUB_TOKEN 无 administration 权限（这是 GitHub 的硬限制），
          # 所以改仓库 description / topics 需要有 admin 权限的 PAT 手动执行。
          # 这步失败不影响 release 本身，故 continue-on-error。
          gh api --method PATCH "repos/${{ github.repository }}" \
            --field 'description=丰容/节能项目评审框架：四维度检查清单 + 评审闭环 + 证据纪律。一个在真实使用中迭代出来的开源框架，给人类与 agent 两套入口。' \
            --silent
          gh api --method PUT "repos/${{ github.repository }}/topics" \
            --input - \
            --header "Accept: application/vnd.github+json" <<'JSON'
          {
            "names": [
              "project-review",
              "ai-assisted-workflow",
              "decision-framework",
              "agent-skill",
              "prompt-engineering",
              "knowledge-management",
              "productivity",
              "framework"
            ]
          }
          JSON
          echo "repository description and topics updated"
